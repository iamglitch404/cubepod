name: cubepod_benchmarks
description: Internal benchmarks and performance testing suite for CubePod.
version: 0.1.5
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cubepod_core:
    path: ../cubepod_core
  cubepod_state:
    path: ../cubepod_state
  cubepod_async:
    path: ../cubepod_async
  cubepod_query:
    path: ../cubepod_query
  cubepod_events:
    path: ../cubepod_events
  cubepod_network:
    path: ../cubepod_network
  cubepod_scheduler:
    path: ../cubepod_scheduler
  cubepod_resources:
    path: ../cubepod_resources
  cubepod_enterprise:
    path: ../cubepod_enterprise
  cubepod_flutter:
    path: ../cubepod_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

dependency_overrides:
  cubepod_core:
    path: ../cubepod_core
  cubepod_state:
    path: ../cubepod_state
  cubepod_async:
    path: ../cubepod_async
  cubepod_query:
    path: ../cubepod_query
  cubepod_events:
    path: ../cubepod_events
  cubepod_network:
    path: ../cubepod_network
  cubepod_scheduler:
    path: ../cubepod_scheduler
  cubepod_resources:
    path: ../cubepod_resources
  cubepod_enterprise:
    path: ../cubepod_enterprise
repository: https://github.com/iamglitch404/cubepod
