name: hacker_news_app
description: A Hacker News client showcasing CubePod DI.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cubepod_core:
    path: ../../packages/cubepod_core
  cubepod_flutter:
    path: ../../packages/cubepod_flutter
  go_router: ^14.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  html_unescape: ^2.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
