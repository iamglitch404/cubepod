name: cubepod_example
description: Manual test app for the CubePod framework.
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  cubepod_core:
    path: ../packages/cubepod_core
  cubepod_state:
    path: ../packages/cubepod_state
  cubepod_async:
    path: ../packages/cubepod_async
  cubepod_events:
    path: ../packages/cubepod_events
  cubepod_network:
    path: ../packages/cubepod_network
  cubepod_query:
    path: ../packages/cubepod_query
  cubepod_scheduler:
    path: ../packages/cubepod_scheduler
  cubepod_resources:
    path: ../packages/cubepod_resources
  cubepod_enterprise:
    path: ../packages/cubepod_enterprise
  cubepod_annotation:
    path: ../packages/cubepod_annotation

dev_dependencies:
  cubepod_generator:
    path: ../packages/cubepod_generator
  build_runner: ^2.0.0
  lints: ^3.0.0
  test: ^1.24.0

# Force all inter-package deps to resolve from local paths
dependency_overrides:
  cubepod_core:
    path: ../packages/cubepod_core
  cubepod_state:
    path: ../packages/cubepod_state
  cubepod_async:
    path: ../packages/cubepod_async
  cubepod_events:
    path: ../packages/cubepod_events
  cubepod_network:
    path: ../packages/cubepod_network
  cubepod_query:
    path: ../packages/cubepod_query
  cubepod_scheduler:
    path: ../packages/cubepod_scheduler
  cubepod_resources:
    path: ../packages/cubepod_resources
  cubepod_enterprise:
    path: ../packages/cubepod_enterprise
  cubepod_annotation:
    path: ../packages/cubepod_annotation
